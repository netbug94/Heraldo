services:
  mensajero:
    build:
      context: ./heraldo-mensajero
    container_name: heraldo-mensajero
    ports:
      - "${MENSAJERO_PORT:-3000}:3000"
    volumes:
      - ./heraldo-mensajero/sessions:/app/sessions
    env_file:
      - .env
    networks:
      - heraldo-network
    restart: unless-stopped

  gestor:
    build:
      context: ./heraldo-gestor
    container_name: heraldo-gestor
    ports:
      - "${GESTOR_PORT:-8080}:8080"
    volumes:
      - ./heraldo-gestor/config:/app/config
      - ./heraldo-gestor/tokens:/app/tokens
    env_file:
      - .env
    environment:
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - EXTERNAL_PORT=${GESTOR_PORT:-8080}
    networks:
      - heraldo-network
    depends_on:
      - mensajero
    restart: unless-stopped

networks:
  heraldo-network:
    driver: bridge
