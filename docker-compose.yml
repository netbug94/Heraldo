services:
  mensajero:
    build:
      context: ./heraldo-mensajero
    container_name: heraldo-mensajero
    ports:
      - "${MENSAJERO_PORT:-3000}:3000"
    volumes:
      - ./heraldo-mensajero/sessions:/app/sessions
    env_file:
      - .env
    networks:
      - heraldo-network
    environment:
      - HERALDO_INTERNAL_TOKEN=${HERALDO_INTERNAL_TOKEN}
    restart: unless-stopped
    # ── MEMORY DISCIPLINE ──
    deploy:
      resources:
        limits:
          memory: 512M # Ceiling for Puppeteer/Chrome
        reservations:
          memory: 256M # Guaranteed minimum

  gestor:
    build:
      context: ./heraldo-gestor
    container_name: heraldo-gestor
    ports:
      - "${GESTOR_PORT:-8080}:8080"
    volumes:
      - ./heraldo-gestor/config:/app/config
      - ./heraldo-gestor/tokens:/app/tokens
    env_file:
      - .env
    environment:
      - HERALDO_INTERNAL_TOKEN=${HERALDO_INTERNAL_TOKEN}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - EXTERNAL_PORT=${GESTOR_PORT:-8080}
    networks:
      - heraldo-network
    depends_on:
      - mensajero
    restart: unless-stopped
    # ── MEMORY DISCIPLINE ──
    deploy:
      resources:
        limits:
          memory: 1G # 1Gig to prevent Puppeteer OOM crashes
        reservations:
          memory: 512M # Guaranteed minimum

networks:
  heraldo-network:
    driver: bridge
