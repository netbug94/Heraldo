services:
  caddy:
    image: caddy:alpine
    container_name: heraldo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - heraldo-network
    depends_on:
      - gestor
      - mensajero

  mensajero:
    build:
      context: ./heraldo-mensajero
    container_name: heraldo-mensajero
    expose:
      - "3000"
    volumes:
      - ./heraldo-mensajero/sessions:/app/sessions
    env_file:
      - .env
    networks:
      - heraldo-network
    restart: unless-stopped

  gestor:
    build:
      context: ./heraldo-gestor
    container_name: heraldo-gestor
    expose:
      - "8080"
    ports:
      - "8888:8888"   # Keep this exposed if needed for legacy fallback, otherwise we can remove it
    volumes:
      - ./heraldo-gestor/config:/app/config
      - ./heraldo-gestor/tokens:/app/tokens
    env_file:
      - .env
    environment:
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
    networks:
      - heraldo-network
    depends_on:
      - mensajero
    restart: unless-stopped

networks:
  heraldo-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
