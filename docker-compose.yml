services:
  mensajero:
    build:
      context: ./heraldo-mensajero
    container_name: heraldo-mensajero
    ports:
      - "3000:3000"
    volumes:
      - ./heraldo-mensajero/sessions:/app/sessions
    env_file:
      - .env
    networks:
      - heraldo-network
    restart: unless-stopped

  gestor:
    build:
      context: ./heraldo-gestor
    container_name: heraldo-gestor
    ports:
      - "8080:8080"   # API
      - "8888:8888"   # Google Auth Callback
    volumes:
      - ./heraldo-gestor/config:/app/config
      - ./heraldo-gestor/tokens:/app/tokens
    env_file:
      - .env
    networks:
      - heraldo-network
    depends_on:
      - mensajero
    restart: unless-stopped

networks:
  heraldo-network:
    driver: bridge
